name: UI Tests (BDD)

on:
  schedule:
    - cron: '0 22 * * 0,3'  # Sunday + Wednesday midnight Vienna
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bdd-tests:
    name: BDD UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ACTIONS_RUNNER_NODE_VERSION: node24
      BASE_URL: https://job-tracker-frontend-green-sigma.vercel.app
      API_URL: https://job-tracker-backend-production-7acf.up.railway.app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run BDD UI Tests
        run: npm run test:bdd

      - name: Notify Slack - BDD Results
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/notify-bdd-slack.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bdd-results
          path: results/cucumber-report.json
          retention-days: 30
