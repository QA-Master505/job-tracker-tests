name: Allure Report CI

on:
  workflow_run:
    workflows: ["API Tests", "Full Test Suite"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-and-report:
    name: Test and Publish Allure Report
    if: >
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.name == 'API Tests' ||
        github.event.workflow_run.name == 'Full Test Suite')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    env:
      ACTIONS_RUNNER_NODE_VERSION: node24

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: job_tracker_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: ../
        run: |
          git clone https://github.com/QA-Master505/job-tracker-backend.git
          cd job-tracker-backend
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Run database migrations
        working-directory: ../job-tracker-backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/job_tracker_db
          SECRET_KEY: ci-secret-key-for-testing-only
        run: |
          source .venv/bin/activate
          alembic upgrade head

      - name: Start backend server
        working-directory: ../job-tracker-backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/job_tracker_db
          SECRET_KEY: ci-secret-key-for-testing-only
        run: |
          source .venv/bin/activate
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &

      - name: Wait for backend to be ready
        run: |
          curl --retry 15 --retry-delay 2 --retry-connrefused --silent --fail \
            http://localhost:8000/docs

      - name: Install Playwright dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install Newman
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Restore Jira ticket cache
        uses: actions/cache/restore@v4
        with:
          path: .jira-tickets.json
          key: jira-tickets-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            jira-tickets-${{ github.ref_name }}-

      - name: Run API tests
        run: npx playwright test tests/api/
        env:
          CI: true
          API_URL: http://localhost:8000
          BASE_URL: http://localhost:5173
          ALLURE_REPORT_URL: https://qa-master505.github.io/job-tracker-tests/
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SLACK_CICD_WEBHOOK_URL: ${{ secrets.SLACK_CICD_WEBHOOK_URL }}
          SLACK_BUGS_WEBHOOK_URL: ${{ secrets.SLACK_BUGS_WEBHOOK_URL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}

      - name: Save Jira ticket cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .jira-tickets.json
          key: jira-tickets-${{ github.ref_name }}-${{ github.run_id }}

      - name: Run Newman / Postman tests
        if: always()
        run: |
          mkdir -p allure-results
          newman run postman/job-tracker-collection.json \
            --environment postman/production-environment.json \
            --reporters cli,junit \
            --reporter-junit-export allure-results/newman-junit.xml \
            --suppress-exit-code

      - name: Debug Newman XML
        if: always()
        run: |
          echo "=== Newman XML first 10 lines ==="
          head -10 allure-results/newman-junit.xml || echo "File not found"

      - name: Notify Slack - Newman Results
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/notify-newman-slack.mjs

      - name: Run BDD UI Tests
        if: always()
        env:
          BASE_URL: https://job-tracker-frontend-green-sigma.vercel.app
          API_URL: https://job-tracker-backend-production-7acf.up.railway.app
        run: npm run test:bdd

      - name: Patch BDD suite name for Allure
        if: always()
        run: |
          python3 -c "
          import os, json, glob
          for f in glob.glob('allure-results/*.json'):
              try:
                  with open(f) as fp:
                      data = json.load(fp)
                  if 'labels' in data:
                      for label in data['labels']:
                          if label.get('name') == 'suite':
                              label['value'] = 'BDD UI Tests'
                          if label.get('name') == 'parentSuite':
                              label['value'] = 'BDD UI Tests'
                  with open(f, 'w') as fp:
                      json.dump(data, fp)
              except:
                  pass
          print('BDD suite labels patched')
          "

      - name: Notify Slack - BDD Results
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/notify-bdd-slack.mjs

      - name: Add Postman suite label and categories
        if: always()
        run: |
          python3 -c "
          import re
          try:
              with open('allure-results/newman-junit.xml', 'r') as f:
                  content = f.read()
              print('Original first 300 chars:', content[:300])
              content = re.sub(
                  r'(<testsuite\s[^>]*name=\")[^\"]*\"',
                  r'\1Postman Tests\"',
                  content
              )
              print('Patched first 300 chars:', content[:300])
              with open('allure-results/newman-junit.xml', 'w') as f:
                  f.write(content)
              print('Patch successful')
          except Exception as e:
              print('Patch failed:', e)
          "
          cat > allure-results/categories.json << 'EOF'
          [
            {
              "name": "Failed tests",
              "matchedStatuses": ["failed"]
            },
            {
              "name": "Broken tests",
              "matchedStatuses": ["broken"]
            }
          ]
          EOF

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Publish to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
