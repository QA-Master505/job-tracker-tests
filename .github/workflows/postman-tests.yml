name: Postman Tests

on:
  schedule:
    - cron: '0 4 * * 1'  # 06:00 AM Vienna (CEST), Monday only - runs alongside API Tests
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  postman-tests:
    name: Postman / Newman Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ACTIONS_RUNNER_NODE_VERSION: node24

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: job_tracker_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: ../
        run: |
          git clone https://github.com/QA-Master505/job-tracker-backend.git
          cd job-tracker-backend
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Run database migrations
        working-directory: ../job-tracker-backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/job_tracker_db
          SECRET_KEY: ci-secret-key-for-testing-only
        run: |
          source .venv/bin/activate
          alembic upgrade head

      - name: Start backend server
        working-directory: ../job-tracker-backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/job_tracker_db
          SECRET_KEY: ci-secret-key-for-testing-only
        run: |
          source .venv/bin/activate
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &

      - name: Wait for backend to be ready
        run: |
          curl --retry 15 --retry-delay 2 --retry-connrefused --silent --fail \
            http://localhost:8000/docs

      - name: Install Newman and reporters
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Run Postman collection
        run: |
          mkdir -p results
          newman run postman/job-tracker-collection.json \
            --environment postman/production-environment.json \
            --reporters cli,htmlextra,junit \
            --reporter-htmlextra-export results/postman-report.html \
            --reporter-junit-export results/postman-junit.xml \
            --suppress-exit-code
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BUGS_WEBHOOK_URL: ${{ secrets.SLACK_BUGS_WEBHOOK_URL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}

      - name: Notify Slack
        if: always()
        run: node scripts/notify-newman-slack.mjs
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postman-report
          path: results/
          retention-days: 30
